<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1TFPF9M56R"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-1TFPF9M56R');
    </script>
    <link rel="icon" type="image/svg+xml" href="../shared/assets/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridWork — Pure Logic Sudoku</title>
    <meta name="description" content="Play GridWork, a free, responsive 9×9 Sudoku web app engineered with unique-solution carving, human-technique difficulty grading, Auto Notes, and zero trial-and-error guessing." />
    <meta name="keywords" content="GridWork, Sudoku, pure logic Sudoku, no-guess Sudoku, free online Sudoku, responsive Sudoku, daily logic puzzle" />

    <meta property="og:title" content="Gridwork — Pure Logic Sudoku" />
    <meta property="og:description" content="No-guess 9×9 Sudoku engineered with unique-solution board carving, Auto Notes, and five human-graded difficulty tiers." />
    <meta property="og:image" content="https://brickeli.github.io/WebApps/GridWork/shared/assets/og-sudoku.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://brickeli.github.io/WebApps/GridWork/shared/assets/og-sudoku.png" />

    <script>
        (function() {
            const theme = localStorage.getItem('gridwork_theme') || localStorage.getItem('sudoku_theme');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <link rel="stylesheet" href="../shared/css/tokens.css">
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="css/sudoku.css">
</head>
<body>
    <div class="status-bar">
        <div class="brand-stack">
            <h1>SUDOKU</h1>
            <span class="app-subtitle">GRIDWORK</span>
        </div>
        <button id="timer-btn" class="timer-btn" aria-label="Pause or Resume Timer">
            <span class="timer-dot"></span>
            <span id="timer-text">00:00</span>
        </button>
    </div>

    <div class="difficulty-container">
        <button class="diff-btn active" data-clues="38" data-label="Easy">Easy</button>
        <button class="diff-btn" data-clues="32" data-label="Medium">Medium</button>
        <button class="diff-btn" data-clues="27" data-label="Hard">Hard</button>
        <button class="diff-btn" data-clues="23" data-label="Expert">Expert</button>
        <button class="diff-btn" data-clues="19" data-label="Master">Master</button>
    </div>

    <div class="controls-row">
        <button id="mode-toggle" class="mode-btn" aria-pressed="false">
            <svg class="icon" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
            <span>Notes Mode:</span>
            <span id="mode-badge" class="user-notes toggle-status off">OFF</span>
        </button>
        <button id="menu-btn" class="menu-trigger-btn" aria-haspopup="true" aria-expanded="false" aria-controls="side-panel">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Menu
        </button>
    </div>

    <div id="menu-overlay" class="menu-overlay"></div>

    <aside id="side-panel" class="side-panel" aria-label="Game Menu">
        <div class="side-panel-header">
            <h2>GAME OPTIONS</h2>
            <button id="close-menu-btn" class="close-menu-btn" aria-label="Close menu">
                <svg class="icon" style="margin:0;width:20px;height:20px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </button>
        </div>
        <button id="auto-notes-menu-btn" class="menu-item-btn">
            <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
            Auto-Fill Notes
            <span id="auto-notes-status" class="toggle-status off">OFF</span>
        </button>
        <button id="theme-menu-btn" class="menu-item-btn">
            <svg class="icon" id="theme-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            Theme
            <span id="theme-status" class="toggle-status light-pill">LIGHT</span>
        </button>
        <hr>
        <button id="reset-menu-btn" class="menu-item-btn">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            Reset Puzzle
        </button>
        <button id="newgame-menu-btn" class="menu-item-btn">
            <svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            New Game
        </button>
        <button id="stats-menu-btn" class="menu-item-btn">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
            High Scores &amp; Stats
        </button>
        <hr>
        <a href="../" class="menu-item-btn" style="text-decoration: none;">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            All GridWork Games
        </a>
    </aside>

    <div class="board-wrapper">
        <div class="game-board" id="board"></div>
        <div id="pause-overlay" class="pause-overlay" style="display: none;">
            <svg style="width:32px;height:32px;margin-bottom:8px;fill:currentColor;" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span>Game Paused</span>
            <small>Tap to Resume</small>
        </div>
    </div>

    <div class="keypad">
        <button class="keypad-btn" id="key-1" data-num="1">1</button>
        <button class="keypad-btn" id="key-2" data-num="2">2</button>
        <button class="keypad-btn" id="key-3" data-num="3">3</button>
        <button class="keypad-btn" id="key-4" data-num="4">4</button>
        <button class="keypad-btn" id="key-5" data-num="5">5</button>
        <button class="keypad-btn" id="key-6" data-num="6">6</button>
        <button class="keypad-btn" id="key-7" data-num="7">7</button>
        <button class="keypad-btn" id="key-8" data-num="8">8</button>
        <button class="keypad-btn" id="key-9" data-num="9">9</button>
        <button class="keypad-btn" data-num="0">Clear</button>
    </div>

    <div class="action-container">
        <button id="hint-btn" class="action-btn hint">
            <svg class="icon" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
            Hint
        </button>
        <button id="undo-btn" class="action-btn undo-input">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
            Undo
        </button>
    </div>

    <!-- Stats Modal -->
    <div id="stats-modal" class="modal">
        <div class="modal-content">
            <h2>COMPLETED PUZZLE STATS</h2>
            <div class="stats-table-container">
                <table id="stats-table">
                    <thead>
                        <tr>
                            <th data-sort="timestamp">Date ⇅</th>
                            <th data-sort="difficulty">Diff ⇅</th>
                            <th data-sort="hints">Hints ⇅</th>
                            <th data-sort="timeVal">Time ⇅</th>
                        </tr>
                    </thead>
                    <tbody id="stats-body"></tbody>
                </table>
            </div>
            <button id="close-stats-btn" class="action-btn hint">
                <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                Close
            </button>
        </div>
    </div>

    <!-- Custom Win Modal -->
    <div id="win-modal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <h2>Puzzle Solved!</h2>
            <p id="win-message"></p>
            <button id="close-win-btn" class="action-btn hint">Awesome!</button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
