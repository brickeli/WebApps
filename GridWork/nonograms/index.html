    <script>
        (function() {
            const theme = localStorage.getItem('gridwork_theme') || localStorage.getItem('sudoku_theme');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

<body>
    <div class="board-wrapper">
        <div class="game-container" id="game-container">
            <div class="top-section">
                <div class="empty-corner"></div>
                <div class="col-clues" id="col-clues"></div>
            </div>
            <div class="row-section">
                <div class="row-clues" id="row-clues"></div>
                <div class="game-board" id="board"></div>
            </div>
        </div>
        <form id="pixel-guess-bar" class="pixel-guess-bar" hidden>
            <label for="pixel-guess-input" class="sr-only">Identify the pixel art object</label>
            <input
                type="text"
                id="pixel-guess-input"
                class="pixel-guess-input"
                placeholder="What is the picture? (e.g., Mushroom)"
                autocomplete="off"
                spellcheck="false"
            />
            <button type="submit" id="pixel-guess-submit" class="pixel-guess-submit">Guess</button>
            <span id="pixel-guess-feedback" class="pixel-guess-feedback" role="status" aria-live="polite"></span>
        </form>
    </div>
    <footer class="suite-footer">
