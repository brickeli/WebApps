<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background Rounded Tile -->
  <rect width="64" height="64" rx="14" fill="#0f172a" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Subtle Peer Row & Column Shading -->
  <rect x="12" y="26" width="40" height="12" rx="2" fill="#1e293b" />
  <rect x="26" y="12" width="12" height="40" rx="2" fill="#1e293b" />

  <!-- 3x3 Nonet Grid Lines -->
  <g stroke="#64748b" stroke-width="2.2" stroke-linecap="round">
    <line x1="25.3" y1="12" x2="25.3" y2="52" />
    <line x1="38.7" y1="12" x2="38.7" y2="52" />
    <line x1="12" y1="25.3" x2="52" y2="25.3" />
    <line x1="12" y1="38.7" x2="52" y2="38.7" />
  </g>

  <!-- Outer Nonet Frame -->
  <rect x="12" y="12" width="40" height="40" rx="5" fill="none" stroke="#f8fafc" stroke-width="2.6" />

  <!-- Active Solved Cell (Center) -->
