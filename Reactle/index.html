<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemical Equation Balancer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Hide number input arrows */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .equation-part {
            display: inline-flex;
            align-items: center;
            margin: 0.5rem 0;
            justify-content: center;
        }

        .molecule {
            font-size: 1.25rem;
            font-weight: 500;
            color: #1f2937;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl p-6 md:p-10 text-center">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Equation Balancer</h1>
            <p class="text-gray-500">Fill in the correct coefficients to balance the chemical equation. Leave blank for 1.</p>
        </div>

        <!-- Scoreboard Section -->
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-6 flex flex-wrap justify-between items-center gap-4">
            <div class="flex gap-6">
                <div class="text-lg font-bold text-green-600">
                    ✅ <span id="score-correct">0</span>
                </div>
                <div class="text-lg font-bold text-red-600">
                    ❌ <span id="score-wrong">0</span>
                </div>
                <div class="text-lg font-bold text-blue-600">
                    Accuracy: <span id="score-percentage">0%</span>
                </div>
            </div>
            <button id="reset-score-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-1 px-3 rounded text-sm transition duration-150">
                Reset Score
            </button>
        </div>

        <!-- Equation Container -->
        <div id="equation-container" class="flex flex-col md:flex-row items-center justify-center gap-4 text-2xl font-semibold mb-8 bg-gray-50 p-6 rounded-xl border border-gray-100 overflow-x-auto min-h-[120px]">
            <!-- Dynamic content injected here -->
        </div>

        <!-- Feedback Message -->
        <div id="feedback" class="h-8 mb-6 font-medium text-lg transition-colors duration-300"></div>

        <!-- Controls -->
        <div class="flex justify-center gap-4 flex-wrap">
            <button id="check-btn" onclick="checkAnswer()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-lg shadow-md transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0">
                Check Answer
            </button>
            <button id="next-btn" onclick="loadRandomEquation()" class="hidden bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 px-8 rounded-lg shadow-md transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0">
                Next Equation
            </button>
        </div>
    </div>

    <script>
        let scoreCorrect = 0;
        let scoreWrong = 0;

        function updateScoreBoard() {
            document.getElementById('score-correct').innerText = scoreCorrect;
            document.getElementById('score-wrong').innerText = scoreWrong;

            let totalAttempts = scoreCorrect + scoreWrong;
            let percentage = totalAttempts === 0 ? 0 : Math.round((scoreCorrect / totalAttempts) * 100);

            document.getElementById('score-percentage').innerText = percentage + '%';
        }

        function resetScore() {
            scoreCorrect = 0;
            scoreWrong = 0;
            updateScoreBoard();
        }

        document.getElementById('reset-score-btn').addEventListener('click', resetScore);

        const equations = [
            // --- Water Synthesis ---
            {
                reactants: [ { formula: "H<sub>2</sub>", coeff: 2 }, { formula: "O<sub>2</sub>", coeff: 1 } ],
                products: [ { formula: "H<sub>2</sub>O", coeff: 2 } ]
            },
            // --- Ammonia Synthesis ---
            {
                reactants: [ { formula: "N<sub>2</sub>", coeff: 1 }, { formula: "H<sub>2</sub>", coeff: 3 } ],
                products: [ { formula: "NH<sub>3</sub>", coeff: 2 } ]
            },
            // --- Methane Combustion ---
            {
                reactants: [ { formula: "CH<sub>4</sub>", coeff: 1 }, { formula: "O<sub>2</sub>", coeff: 2 } ],
                products: [ { formula: "CO<sub>2</sub>", coeff: 1 }, { formula: "H<sub>2</sub>O", coeff: 2 } ]
            },
            // --- Iron Rusting ---
            {
                reactants: [ { formula: "Fe", coeff: 4 }, { formula: "O<sub>2</sub>", coeff: 3 } ],
                products: [ { formula: "Fe<sub>2</sub>O<sub>3</sub>", coeff: 2 } ]
            },
            // --- Salt Synthesis ---
            {
                reactants: [ { formula: "Na", coeff: 2 }, { formula: "Cl<sub>2</sub>", coeff: 1 } ],
                products: [ { formula: "NaCl", coeff: 2 } ]
            },
            // --- Potassium Chlorate Decomposition ---
            {
                reactants: [ { formula: "KClO<sub>3</sub>", coeff: 2 } ],
                products: [ { formula: "KCl", coeff: 2 }, { formula: "O<sub>2</sub>", coeff: 3 } ]
            },
            // --- Aluminum Chloride Synthesis ---
            {
                reactants: [ { formula: "Al", coeff: 2 }, { formula: "Cl<sub>2</sub>", coeff: 3 } ],
                products: [ { formula: "AlCl<sub>3</sub>", coeff: 2 } ]
            },
            // --- Propane Combustion ---
            {
                reactants: [ { formula: "C<sub>3</sub>H<sub>8</sub>", coeff: 1 }, { formula: "O<sub>2</sub>", coeff: 5 } ],
                products: [ { formula: "CO<sub>2</sub>", coeff: 3 }, { formula: "H<sub>2</sub>O", coeff: 4 } ]
            },
            // --- Synthesis & Decomposition ---
            {
                reactants: [ { formula: "Al", coeff: 4 }, { formula: "O<sub>2</sub>", coeff: 3 } ],
                products: [ { formula: "Al<sub>2</sub>O<sub>3</sub>", coeff: 2 } ]
            },
            {
                reactants: [ { formula: "P<sub>4</sub>", coeff: 1 }, { formula: "O<sub>2</sub>", coeff: 5 } ],
                products: [ { formula: "P<sub>4</sub>O<sub>10</sub>", coeff: 1 } ]
            },
            // --- Combustion ---
            {
                reactants: [ { formula: "C<sub>2</sub>H<sub>6</sub>O", coeff: 1 }, { formula: "O<sub>2</sub>", coeff: 3 } ],
                products: [ { formula: "CO<sub>2</sub>", coeff: 2 }, { formula: "H<sub>2</sub>O", coeff: 3 } ]
            },
            {
                reactants: [ { formula: "C<sub>8</sub>H<sub>18</sub>", coeff: 2 }, { formula: "O<sub>2</sub>", coeff: 25 } ],
                products: [ { formula: "CO<sub>2</sub>", coeff: 16 }, { formula: "H<sub>2</sub>O", coeff: 18 } ]
            },
            // --- Acid-Base (Neutralization) ---
            {
                reactants: [ { formula: "H<sub>2</sub>SO<sub>4</sub>", coeff: 1 }, { formula: "NaOH", coeff: 2 } ],
                products: [ { formula: "Na<sub>2</sub>SO<sub>4</sub>", coeff: 1 }, { formula: "H<sub>2</sub>O", coeff: 2 } ]
            },
            {
                reactants: [ { formula: "H<sub>3</sub>PO<sub>4</sub>", coeff: 1 }, { formula: "KOH", coeff: 3 } ],
                products: [ { formula: "K<sub>3</sub>PO<sub>4</sub>", coeff: 1 }, { formula: "H<sub>2</sub>O", coeff: 3 } ]
            },
            {
                reactants: [ { formula: "Ca(OH)<sub>2</sub>", coeff: 1 }, { formula: "HCl", coeff: 2 } ],
                products: [ { formula: "CaCl<sub>2</sub>", coeff: 1 }, { formula: "H<sub>2</sub>O", coeff: 2 } ]
            },
            {
                reactants: [ { formula: "Al(OH)<sub>3</sub>", coeff: 2 }, { formula: "H<sub>2</sub>SO<sub>4</sub>", coeff: 3 } ],
                products: [ { formula: "Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>", coeff: 1 }, { formula: "H<sub>2</sub>O", coeff: 6 } ]
            },
            // --- Redox & Replacement ---
            {
                reactants: [ { formula: "Zn", coeff: 1 }, { formula: "HCl", coeff: 2 } ],
                products: [ { formula: "ZnCl<sub>2</sub>", coeff: 1 }, { formula: "H<sub>2</sub>", coeff: 1 } ]
            },
            {
                reactants: [ { formula: "Cu", coeff: 1 }, { formula: "AgNO<sub>3</sub>", coeff: 2 } ],
                products: [ { formula: "Cu(NO<sub>3</sub>)<sub>2</sub>", coeff: 1 }, { formula: "Ag", coeff: 2 } ]
            },
            {
                reactants: [ { formula: "Fe<sub>2</sub>O<sub>3</sub>", coeff: 1 }, { formula: "CO", coeff: 3 } ],
                products: [ { formula: "Fe", coeff: 2 }, { formula: "CO<sub>2</sub>", coeff: 3 } ]
            },
            {
                reactants: [ { formula: "Al", coeff: 2 }, { formula: "Fe<sub>2</sub>O<sub>3</sub>", coeff: 1 } ],
                products: [ { formula: "Al<sub>2</sub>O<sub>3</sub>", coeff: 1 }, { formula: "Fe", coeff: 2 } ]
            }, // Fixed missing comma here
            // --- Biological / Complex ---
            {
                reactants: [ { formula: "CO<sub>2</sub>", coeff: 6 }, { formula: "H<sub>2</sub>O", coeff: 6 } ],
                products: [ { formula: "C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>", coeff: 1 }, { formula: "O<sub>2</sub>", coeff: 6 } ]
            },
            {
                reactants: [ { formula: "C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>", coeff: 1 }, { formula: "O<sub>2</sub>", coeff: 6 } ],
                products: [ { formula: "CO<sub>2</sub>", coeff: 6 }, { formula: "H<sub>2</sub>O", coeff: 6 } ]
            },
            // --- Decomposition ---
            {
                reactants: [ { formula: "H<sub>2</sub>O<sub>2</sub>", coeff: 2 } ],
                products: [ { formula: "H<sub>2</sub>O", coeff: 2 }, { formula: "O<sub>2</sub>", coeff: 1 } ]
            },
            {
                reactants: [ { formula: "CaCO<sub>3</sub>", coeff: 1 } ],
                products: [ { formula: "CaO", coeff: 1 }, { formula: "CO<sub>2</sub>", coeff: 1 } ]
            },
            {
                reactants: [ { formula: "NH<sub>4</sub>NO<sub>3</sub>", coeff: 1 } ],
                products: [ { formula: "N<sub>2</sub>O", coeff: 1 }, { formula: "H<sub>2</sub>O", coeff: 2 } ]
            },
            // --- Double Replacement ---
            {
                reactants: [ { formula: "AgNO<sub>3</sub>", coeff: 1 }, { formula: "NaCl", coeff: 1 } ],
                products: [ { formula: "AgCl", coeff: 1 }, { formula: "NaNO<sub>3</sub>", coeff: 1 } ]
            },
            {
                reactants: [ { formula: "Pb(NO<sub>3</sub>)<sub>2</sub>", coeff: 1 }, { formula: "KI", coeff: 2 } ],
                products: [ { formula: "PbI<sub>2</sub>", coeff: 1 }, { formula: "KNO<sub>3</sub>", coeff: 2 } ]
            },
            // --- Single Replacement ---
            {
                reactants: [ { formula: "Na", coeff: 2 }, { formula: "H<sub>2</sub>O", coeff: 2 } ],
                products: [ { formula: "NaOH", coeff: 2 }, { formula: "H<sub>2</sub>", coeff: 1 } ]
            },
            // --- Synthesis & Oxidation ---
            {
                reactants: [ { formula: "Mg", coeff: 2 }, { formula: "O<sub>2</sub>", coeff: 1 } ],
                products: [ { formula: "MgO", coeff: 2 } ]
            },
            {
                reactants: [ { formula: "SO<sub>2</sub>", coeff: 2 }, { formula: "O<sub>2</sub>", coeff: 1 } ],
                products: [ { formula: "SO<sub>3</sub>", coeff: 2 } ]
            }
        ];

        let currentEquationIndex = -1;
        let inputsArray = [];

        function init() {
            loadRandomEquation();
        }

        function loadRandomEquation() {
            let newIndex = currentEquationIndex;
            while (newIndex === currentEquationIndex && equations.length > 1) {
                newIndex = Math.floor(Math.random() * equations.length);
            }
            currentEquationIndex = newIndex;
            const eq = equations[currentEquationIndex];

            inputsArray = [];
            const container = document.getElementById('equation-container');
            container.innerHTML = '';

            const feedback = document.getElementById('feedback');
            feedback.textContent = '';
            feedback.className = 'h-8 mb-6 font-medium text-lg transition-colors duration-300';

            document.getElementById('check-btn').classList.remove('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            const reactantsDiv = document.createElement('div');
            reactantsDiv.className = 'equation-part';
            eq.reactants.forEach((r, idx) => {
                reactantsDiv.appendChild(createMoleculeGroup(r));
                if (idx < eq.reactants.length - 1) {
                    const plus = document.createElement('span');
                    plus.className = 'text-gray-400 mx-2';
                    plus.textContent = '+';
                    reactantsDiv.appendChild(plus);
                }
            });

            const arrow = document.createElement('div');
            arrow.className = 'text-gray-400 mx-4 font-bold';
            arrow.innerHTML = '&rarr;';

            const productsDiv = document.createElement('div');
            productsDiv.className = 'equation-part';
            eq.products.forEach((p, idx) => {
                productsDiv.appendChild(createMoleculeGroup(p));
                if (idx < eq.products.length - 1) {
                    const plus = document.createElement('span');
                    plus.className = 'text-gray-400 mx-2';
                    plus.textContent = '+';
                    productsDiv.appendChild(plus);
                }
            });

            container.appendChild(reactantsDiv);
            container.appendChild(arrow);
            container.appendChild(productsDiv);

            if (inputsArray.length > 0) {
                inputsArray[0].inputElement.focus();
            }
        }

        function createMoleculeGroup(moleculeData) {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex items-center gap-2';

            const input = document.createElement('input');
            input.type = 'number';
            input.min = '1';
            input.className = 'w-14 h-12 text-center text-xl font-bold bg-white border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all placeholder-gray-300';

            input.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    checkAnswer();
                }
            });

            const label = document.createElement('span');
            label.className = 'molecule';
            label.innerHTML = moleculeData.formula;

            wrapper.appendChild(input);
            wrapper.appendChild(label);

            inputsArray.push({
                inputElement: input,
                expected: moleculeData.coeff
            });

            return wrapper;
        }

        function checkAnswer() {
            let isCorrect = true;

            inputsArray.forEach(item => {
                const userVal = parseInt(item.inputElement.value) || 1;
                if (userVal !== item.expected) {
                    isCorrect = false;
                }
            });

            const feedbackDiv = document.getElementById('feedback');

            if (isCorrect) {
                scoreCorrect++;
                feedbackDiv.innerText = "Correct! Great job.";
                feedbackDiv.className = "h-8 mb-6 font-bold text-lg text-emerald-600 transition-colors duration-300";
                document.getElementById('check-btn').classList.add('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
            } else {
                scoreWrong++;
                feedbackDiv.innerText = "Not quite. Check your coefficients and try again!";
                feedbackDiv.className = "h-8 mb-6 font-bold text-lg text-rose-600 transition-colors duration-300";
            }

            updateScoreBoard();
        }

        window.onload = init;
    </script>
</body>
</html>
